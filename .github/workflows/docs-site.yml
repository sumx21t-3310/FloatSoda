name: Docs Site

# ドキュメントサイトをビルド・検査し、リリースタグ(v*)の push で GitHub Pages へデプロイする。
# 公開面は NuGet の最新リリースと同じコミットの docs/ を映す(main の未リリースの変更は公開しない)。
# main の push と PR はビルドと検査だけを行う。
# 初回だけは、main から workflow_dispatch で手動デプロイする(過去のタグにはこの workflow が無いため)。
# 初回のみ Settings → Pages → Source を "GitHub Actions" にする必要がある(website/README.md)。

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs-site.yml"
  workflow_dispatch:

# ビルドはリポジトリの読み取りだけで足りる。Pages への書き込み権限は deploy ジョブにだけ付ける
permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
        with:
          # 各ページの lastUpdated に docs/ 側の最終コミット日時を使うため、履歴を全部取る
          fetch-depth: 0
          # ビルドは git log を読むだけで push しないので、トークンをローカルの Git 設定に残さない
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build (docs/ → Starlight → dist/)
        run: npm run build

      - name: Verify dist (pages, llms.txt, internal links and anchors)
        run: npm run verify

      # 公開するのはリリースタグと、main からの手動実行(初回の立ち上げ用)だけ。
      # main への push と PR、feature ブランチでの workflow_dispatch はビルドと検査に留める
      - name: Upload Pages artifact
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
